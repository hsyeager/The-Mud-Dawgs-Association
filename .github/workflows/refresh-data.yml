name: Refresh league data

# Re-pulls the league from Sleeper and commits the updated snapshot.
#
# This is the authenticated counterpart to the site's Refresh button. The button
# refreshes what *you* see, in your browser. This workflow updates what
# *everyone* sees, and only people with write access to the repo can start it --
# GitHub itself is the gate, so there is no password to leak in client-side code.
#
# Run it from the Actions tab ("Run workflow"), or let the schedule handle it.
#
# Schedule: Wednesdays at 06:00 America/Chicago, which is a few hours after the
# league's waivers clear (~02:05 CT Wednesday), so the snapshot picks up the
# week's waiver moves.
#
# GitHub cron is UTC only and does not follow daylight saving, but a fantasy
# season straddles the November changeover -- so a single fixed cron would drift
# to 05:00 CT for half the year. Instead both candidate hours fire and a guard
# job drops the one that is not actually 06:00 in Chicago.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 3" # 06:00 CDT (summer, UTC-5)
    - cron: "0 12 * * 3" # 06:00 CST (winter, UTC-6)

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  # Decides whether this particular trigger is the real 06:00 CT one.
  # A manual run always proceeds.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          TRIGGERED_BY: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run -- proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pick the winning cron from WHICH SCHEDULE FIRED, never from the clock
          # at run time. GitHub routinely starts scheduled jobs late -- delays of
          # several hours happen under load -- so "is it 06:00 in Chicago right
          # now" is not a question the runner can answer correctly. It said 09:00
          # and 11:00 on successive weeks and skipped both, refreshing nothing.
          offset=$(TZ=America/Chicago date +%z)
          if [ "$offset" = "-0500" ]; then
            want="0 11 * * 3" # CDT: 11:00 UTC is 06:00 Chicago
          else
            want="0 12 * * 3" # CST: 12:00 UTC is 06:00 Chicago
          fi

          echo "Chicago is at UTC${offset}; the 06:00 trigger is '${want}'."
          echo "This run was started by '${TRIGGERED_BY}'."

          if [ "$TRIGGERED_BY" = "$want" ]; then
            echo "Matches -- proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Other trigger for the current DST regime -- skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bake league snapshot
        run: npm run bake

      - name: Commit if the league actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/; then
            echo "No change in league data."
            exit 0
          fi

          # Every bake stamps a fresh `generatedAt`, so the file always differs
          # even when the league itself is untouched. Ignore that one line, or
          # the offseason would produce a commit a week that says nothing.
          substantive=$(git diff -U0 -- data/ \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -v '"generatedAt"' \
            | head -1)

          if [ -z "$substantive" ]; then
            echo "Only the generated-at timestamp moved -- nothing worth committing."
            git checkout -- data/
            exit 0
          fi

          git add data/
          git commit -m "chore(data): refresh league snapshot from Sleeper"
          git push
